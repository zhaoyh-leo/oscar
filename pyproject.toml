[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "oscar"
version = "0.1.0"
description = "Open-Source Completeness Audit & Review"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "langchain-anthropic>=0.3",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "PyMuPDF>=1.25.0",
    "rich>=13.7",
    # Code/paper vector stores: CodeBERT embeddings + FAISS + BM25
    "numpy>=1.26",
    "torch>=2.2",
    "transformers>=4.40",
    "faiss-cpu>=1.8",
    "rank-bm25>=0.2.2",
    # git 克隆走系统 git 二进制(subprocess)，GitPython 实际未使用
    "gitpython>=3.1.0",
    # 分层配置:.env 密钥 + config.yaml 可调参数
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    # 模型下载脚本 scripts/download_models.py 使用(取 bert/ 模型)
    "huggingface-hub>=0.23",
]

[project.scripts]
oscar = "main:main"

[tool.setuptools.packages.find]
include = ["oscar*"]